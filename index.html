
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Codes Constructeur</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --bg-page: #f0f2f5;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a90e2;
      --shadow: rgba(0,0,0,0.1);
      --accent-rgb: 74,144,226;
    }
    .dark {
      --bg-page: #1e1e1e;
      --bg-card: #2a2a2a;
      --text-primary: #eeeeee;
      --text-secondary: #bbbbbb;
      --accent: #6ca0dc;
    }
    * { box-sizing: border-box; margin:0; padding:0 }
    body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Segoe UI',sans-serif;
      display: flex;
      align-items: center; justify-content: center;
      height: 100vh;
      transition: background .3s, color .3s;
    }
    .card {
      background: var(--bg-card);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px var(--shadow);
      width: 90%; max-width: 360px;
      text-align: center;
    }
    /* Logo LFB Group | Hydronic : conçu pour fond clair, donc placé sur une plaque blanche
       (invisible sur la carte claire, nécessaire en thème sombre). */
    .logo {
      width: 260px; max-width: 100%; height: auto;
      margin: 0 auto 1rem; display: block;
      background: #ffffff; border-radius: 6px; padding: .3rem .5rem;
    }
    h1 {
      color: var(--accent); font-size: 1.5rem; margin-bottom: 1rem;
    }
    #controls {
      display: flex; flex-wrap: wrap;
      justify-content: center; align-items: center;
      gap: .5rem; margin-bottom: 1.5rem;
    }
    [role="radiogroup"] { display: flex; gap: .5rem; }
    label {
      position: relative; padding-left: 1.8rem;
      font-size: .9rem; color: var(--text-secondary);
      cursor: pointer; user-select: none;
    }
    input[type="radio"] {
      position: absolute; opacity: 0; cursor: pointer;
    }
    input[type="radio"] + span {
      position: absolute; left:0; top:50%; transform:translateY(-50%);
      width:1rem; height:1rem;
      border:2px solid var(--accent); border-radius:50%;
    }
    input[type="radio"]:checked + span {
      background: var(--accent);
    }
    input[type="date"] {
      padding: .4rem .5rem;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:.9rem;
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .code-block {
      background: var(--bg-page);
      margin: .5rem 0;
      padding: .8rem 1rem;
      border-radius:8px;
      box-shadow:0 2px 8px var(--shadow);
    }
    .label-code {
      font-size:.8rem; color:var(--text-secondary);
      text-transform:uppercase; margin-bottom:.3rem;
    }
    .code-wrapper {
      display:flex; align-items:center; justify-content:center;
    }
    .code-value {
      font-size:2.5rem; font-weight:bold;
      color:var(--accent); line-height:1;
    }
    .copy-btn {
      background:none; border:none; margin-left:.5rem;
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
    }
    .copy-btn:focus { outline:2px solid var(--accent); }
    @keyframes pulse {
      0%   { box-shadow:0 0 0 0 rgba(var(--accent-rgb),.7); }
      70%  { box-shadow:0 0 0 10px rgba(var(--accent-rgb),0); }
      100% { box-shadow:0 0 0 0 rgba(var(--accent-rgb),0); }
    }
    .pulse { animation:pulse .8s ease-out; }

    .footer-btns {
      display:flex; justify-content:center;
      align-items:center; gap:.5rem; margin-top:1rem;
    }
    .footer-btns button,
    .footer-btns summary {
      background:none; border:none; cursor:pointer;
      font-size:1.2rem; color:var(--accent);
    }
    .footer-btns details summary { list-style:none; }
    .lang-selector ul {
      position:absolute; top:1.4em; right:0;
      margin:0; padding:.2rem 0; list-style:none;
      background:var(--bg-card); border:1px solid #ccc;
      border-radius:4px; box-shadow:0 2px 8px var(--shadow);
      display:none; z-index:10;
    }
    .lang-selector[open] ul { display:block; }
    .lang-selector ul li {
      padding:.3rem .8rem; font-size:.85rem;
      color:var(--text-primary); white-space:nowrap;
      cursor:pointer;
    }
    .lang-selector ul li:hover { background:var(--bg-page); }

    .disclaimer {
      margin-top:1rem; font-size:.75rem;
      color:var(--text-secondary);
      text-align:center; line-height:1.2;
      white-space:pre-wrap;
    }
  </style>
</head>

        <h1 id="title">Codes Constructeur</h1>

    <div id="controls">
      <div role="radiogroup" aria-label="Mode">
        <label for="radio-auto">
          <input id="radio-auto" type="radio" name="mode" value="auto" checked>
          <span></span><span id="auto-text">Auto</span>
        </label>
        <label for="radio-manuel">
          <input id="radio-manuel" type="radio" name="mode" value="manuel">
          <span></span><span id="manuel-text">Manuel</span>
        </label>
      </div>
      <input type="date" id="datePicker" disabled>
    </div>

    <div id="display">
      <div class="code-block">
        <div class="label-code" id="label-matin">Matin</div>
        <div class="code-wrapper">
          <div id="code-matin" class="code-value">----</div>
          <button class="copy-btn" data-target="code-matin" aria-label="Copier">📋</button>
        </div>
      </div>
      <div class="code-block">
        <div class="label-code" id="label-apres">Après-midi</div>
        <div class="code-wrapper">
          <div id="code-apres" class="code-value">----</div>
          <button class="copy-btn" data-target="code-apres" aria-label="Copier">📋</button>
        </div>
      </div>
    </div>

    <div class="footer-btns">
      <button id="share-btn" aria-label="Partager">🔗</button>
      <button id="help-btn" aria-label="Documentation technique">📖</button>
      <details class="lang-selector" aria-label="Choix de la langue">
        <summary>🌐</summary>
        <ul>
          <li data-lang="fr">FR</li><li data-lang="en">EN</li><li data-lang="de">DE</li>
          <li data-lang="es">ES</li><li data-lang="it">IT</li><li data-lang="pt">PT</li>
          <li data-lang="nl">NL</li><li data-lang="sv">SV</li><li data-lang="fi">FI</li>
          <li data-lang="da">DA</li>
        </ul>
      </details>
      <button id="theme-toggle" aria-label="Basculer thème">🌙</button>
    </div>

    <div class="disclaimer" id="disclaimer">
      Réservé aux techniciens Hydronic.
      Toute utilisation sans autorisation entraîne la rupture de garantie de la CTA.
    </div>
  </div>

  <script>
    // Traductions complètes
    const translations = {
      fr:{ title:"Codes Constructeur", auto:"Auto", manuel:"Manuel", matin:"Matin", apres:"Après-midi",
           disclaimer:"Réservé aux techniciens Hydronic.\nToute utilisation sans autorisation entraîne la rupture de garantie de la CTA." },
      en:{ title:"Manufacturer Codes", auto:"Auto", manuel:"Manual", matin:"Morning", apres:"Afternoon",
           disclaimer:"For Hydronic technicians only.\nUnauthorized use voids the CTA warranty." },
      de:{ title:"Hersteller-Codes", auto:"Auto", manuel:"Manuell", matin:"Morgen", apres:"Nachmittag",
           disclaimer:"Nur für Hydronic-Techniker.\nUnbefugte Nutzung führt zum Garantieverlust der CTA." },
      es:{ title:"Códigos Constructores", auto:"Auto", manuel:"Manual", matin:"Mañana", apres:"Tarde",
           disclaimer:"Reservado a técnicos Hydronic.\nEl uso no autorizado anula la garantía de la CTA." },
      it:{ title:"Codici Costruttore", auto:"Auto", manuel:"Manuale", matin:"Mattina", apres:"Pomeriggio",
           disclaimer:"Riservato ai tecnici Hydronic.\nL'uso non autorizzato annulla la garanzia CTA." },
      pt:{ title:"Códigos do Fabricante", auto:"Auto", manuel:"Manual", matin:"Manhã", apres:"Tarde",
           disclaimer:"Reservado para técnicos Hydronic.\nO uso não autorizado anula a garantia da CTA." },
      nl:{ title:"Fabrikantcodes", auto:"Auto", manuel:"Handmatig", matin:"Ochtend", apres:"Middag",
           disclaimer:"Voorbehouden aan Hydronic-technici.\nOngeautoriseerd gebruik leidt tot verlies van de CTA-garantie." },
      sv:{ title:"Tillverkarkoder", auto:"Auto", manuel:"Manuell", matin:"Morgon", apres:"Eftermiddag",
           disclaimer:"Endast för Hydronic-tekniker.\nObehörig användning upphäver CTA-garantin." },
      fi:{ title:"Valmistajakoodit", auto:"Auto", manuel:"Manuaalinen", matin:"Aamu", apres:"Ilta",
           disclaimer:"Vain Hydronic-teknikoille.\nLuvaton käyttö mitätöi CTA-takuun." },
      da:{ title:"Producentkoder", auto:"Auto", manuel:"Manuel", matin:"Morgen", apres:"Eftermiddag",
           disclaimer:"Kun for Hydronic-teknikere.\nUautoriseret brug ophæver CTA-garantien." }
    };

    // Applique la langue
    function applyLang(lang) {
      const t = translations[lang]||translations.fr;
      document.getElementById('title').textContent      = t.title;
      document.getElementById('auto-text').textContent   = t.auto;
      document.getElementById('manuel-text').textContent = t.manuel;
      document.getElementById('label-matin').textContent = t.matin;
      document.getElementById('label-apres').textContent = t.apres;
      document.getElementById('disclaimer').textContent  = t.disclaimer;
      localStorage.setItem('lang', lang);
    }

    // Calcule les codes
    function calculerCodes(d) {
      const j=d.getDate(), m=d.getMonth()+1, y=d.getFullYear()-2000;
      return {
        matin:(((j*m)+(y*10)+(j*23))%9997+3).toString().padStart(4,'0'),
        apres:(((j*m)+(y*12)+(j*23))%9997+3).toString().padStart(4,'0')
      };
    }
    // Met à jour et pulse
    function rafraichir(d) {
      const { matin, apres } = calculerCodes(d);
      document.getElementById('code-matin').textContent = matin;
      document.getElementById('code-apres').textContent  = apres;
      document.querySelectorAll('.code-block').forEach(b=>{
        b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
      });
    }

    // Initialisation
    const radioAuto   = document.getElementById('radio-auto');
    const radioManuel = document.getElementById('radio-manuel');
    const datePicker  = document.getElementById('datePicker');
    const shareBtn    = document.getElementById('share-btn');
    const helpBtn     = document.getElementById('help-btn');
    const btnTheme    = document.getElementById('theme-toggle');
    const langSel     = document.querySelector('.lang-selector');

    // Thème
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      btnTheme.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('themeDark', dark);
    }
    btnTheme.addEventListener('click',()=>applyTheme(!document.body.classList.contains('dark')));

    // Radio Auto/Manuel
    function updateMode() {
      if (radioManuel.checked) {
        datePicker.disabled = false;
      } else {
        datePicker.disabled = true;
        rafraichir(new Date());
      }
    }
    radioAuto.addEventListener('change',updateMode);
    radioManuel.addEventListener('change',updateMode);

    // Date manual change
    datePicker.addEventListener('input',()=>{
      rafraichir(new Date(datePicker.value));
    });

    // Copier
    document.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const t = document.getElementById(btn.dataset.target).textContent;
        try { await navigator.clipboard.writeText(t);
              btn.textContent='✅'; setTimeout(()=>btn.textContent='📋',1000);
        } catch { btn.textContent='❌'; }
      });
    });

    // Partager le code actif
    shareBtn.addEventListener('click',async()=>{
      const now = new Date(), h = now.getHours();
      const codes = calculerCodes(now);
      const actif = h < 12 ? `Matin: ${codes.matin}` : `Après-midi: ${codes.apres}`;
      if (navigator.share) {
        try { await navigator.share({ title:translations[localStorage.getItem('lang')||'fr'].title, text:actif }); }
        catch(e){ console.warn('Share failed',e); }
      } else {
        // fallback : copie et alerte
        await navigator.clipboard.writeText(actif);
        alert(actif + '\n(copié dans le presse-papier)');
      }
    });

    // Aide
    helpBtn.addEventListener('click',()=>window.open('https://www.hydronic.fr/configuration-mcx','_blank'));

    // Langue
    langSel.querySelectorAll('li').forEach(li=>{
      li.addEventListener('click',()=>{
        applyLang(li.dataset.lang);
        langSel.removeAttribute('open');
      });
    });

    // Initialisation globale
    applyLang(localStorage.getItem('lang')||'fr');
    applyTheme(localStorage.getItem('themeDark')==='true');
    datePicker.valueAsDate = new Date();
    rafraichir(new Date());
    setInterval(()=>{
      if (radioAuto.checked) rafraichir(new Date());
    },60000);
    updateMode();
  </script>
</body>
</html>
